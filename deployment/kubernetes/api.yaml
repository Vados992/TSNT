apiVersion: v1
kind: Namespace
metadata:
  name: tsnt
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tsnt-api
  namespace: tsnt
data:
  TSNT_ENV: production
  TSNT_LOG_LEVEL: INFO
  TSNT_REQUIRE_PROVENANCE: "true"
  TSNT_MAX_MONTE_CARLO_RUNS: "100000"
---
apiVersion: v1
kind: Secret
metadata:
  name: tsnt-api
  namespace: tsnt
type: Opaque
stringData:
  TSNT_DATABASE_URL: REPLACE_WITH_SECRET_MANAGER_REFERENCE
  TSNT_REDIS_URL: REPLACE_WITH_SECRET_MANAGER_REFERENCE
  TSNT_API_KEY: REPLACE_WITH_RANDOM_SECRET
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsnt-api
  namespace: tsnt
spec:
  replicas: 2
  selector:
    matchLabels: {app: tsnt-api}
  template:
    metadata:
      labels: {app: tsnt-api}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: ghcr.io/vados992/tsnt:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: tsnt-api}
            - secretRef: {name: tsnt-api}
          ports:
            - {name: http, containerPort: 8000}
          readinessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            initialDelaySeconds: 15
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: tsnt-api
  namespace: tsnt
spec:
  selector: {app: tsnt-api}
  ports:
    - {name: http, port: 80, targetPort: http}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tsnt-api
  namespace: tsnt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tsnt-api
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tsnt-api
  namespace: tsnt
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: tsnt-api}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: tsnt
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
