[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tsnt-engine"
version = "0.1.0"
description = "Reproducible reference implementation of the TSNT analytical architecture"
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
authors = [{name = "Vadym Tsinderhoz"}]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "numpy>=2.1,<3",
  "scipy>=1.14,<2",
  "networkx>=3.3,<4",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<7",
  "typer>=0.12,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.6,<1"
]

[project.scripts]
tsnt = "tsnt.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tsnt"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=tsnt --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["tsnt"]
